openapi: 3.0.3
info:
  title: Employee Management API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /employees:
    get:
      summary: List all employees
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"

    post:
      summary: Create employee
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{employee_id}:
    get:
      summary: Get employee by ID
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

    put:
      summary: Update employee
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

    delete:
      summary: Delete employee
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

components:
  schemas:
    Employee:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        department:
          type: string
        date_joined:
          type: string
          format: date

    EmployeeInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        department:
          type: string
        date_joined:
          type: string
          format: date
